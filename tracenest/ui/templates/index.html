<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TraceNest</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div id="app-container" class="theme-light">
  <div class="d-flex vh-100 overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar border-end d-flex flex-column">
      <div class="p-4">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="logo-text h5 mb-0 fw-bold">TraceNest</span>
        </div>
        <a href="/" class="text-muted text-decoration-none small">← Back</a>
      </div>

      <div class="flex-grow-1 overflow-auto px-3 custom-scroll" id="file-list"></div>
    </aside>

    <!-- MAIN -->
    <main class="flex-grow-1 d-flex flex-column overflow-hidden position-relative">

      <!-- HEADER -->
      <header class="p-3 border-bottom d-flex justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center gap-3">
          <!-- Refresh Controls -->
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-icon btn-subtle" id="manualRefreshBtn" title="Refresh Logs">
              <i class="bi bi-arrow-clockwise fs-6"></i>
            </button>
            <div class="form-check form-switch ms-2 mb-0">
              <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
              <label class="form-check-label" for="autoRefreshToggle">
                <span id="refresh-status" class="status-indicator live small fw-medium">
                  <span class="dot"></span> Live
                </span>
              </label>
            </div>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          
          <!-- Level Dropdown Filter -->
          <div class="dropdown me-2">
            <button class="btn btn-sm btn-subtle dropdown-toggle d-flex align-items-center gap-2" type="button" id="levelFilterDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-funnel"></i> Level: <span id="currentLevelLabel">All</span>
            </button>
            <ul class="dropdown-menu shadow-sm" id="levelFilterMenu">
              <li><button class="dropdown-item active" data-level="all">All</button></li>
              <li><hr class="dropdown-divider"></li>
              <li><button class="dropdown-item" data-level="debug">Debug</button></li>
              <li><button class="dropdown-item" data-level="info">Info</button></li>
              <li><button class="dropdown-item" data-level="warning">Warning</button></li>
              <li><button class="dropdown-item" data-level="error">Error</button></li>
              <li><button class="dropdown-item" data-level="fatal">Fatal</button></li>
            </ul>
          </div>

          <div class="input-group input-group-sm custom-search" style="width: 250px;">
            <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control search-input" placeholder="Search message, trace_id...">
          </div>

          <div class="dropdown ms-2">
            <button class="btn btn-icon btn-subtle" type="button" data-bs-toggle="dropdown" title="Theme Settings">
              <i class="bi bi-palette"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end theme-menu shadow-sm">
              <li class="dropdown-header">Light / Dark</li>
              <li><button class="dropdown-item" data-theme="light">Light</button></li>
              <li><button class="dropdown-item" data-theme="dark">Dark</button></li>
              <li><hr class="dropdown-divider"></li>
              <li class="dropdown-header">Colorful</li>
              <li><button class="dropdown-item" data-theme="dark-blue">Dark Blue</button></li>
              <li><button class="dropdown-item" data-theme="emerald">Emerald (Green)</button></li>
              <li><button class="dropdown-item" data-theme="ruby">Ruby (Red)</button></li>
              <li><button class="dropdown-item" data-theme="amethyst">Amethyst (Purple)</button></li>
              <li><hr class="dropdown-divider"></li>
              <li class="dropdown-header">Contrast</li>
              <li><button class="dropdown-item" data-theme="midnight">Midnight (OLED)</button></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- CONTENT AREA (Table + Details Panel) -->
      <div class="d-flex flex-grow-1 overflow-hidden">
        
        <!-- TABLE -->
        <div class="flex-grow-1 d-flex flex-column overflow-hidden">
          <div class="flex-grow-1 overflow-auto custom-scroll" id="table-scroll-area">
            <table class="table custom-table mb-0">
              <thead class="sticky-top">
                <tr>
                  <th style="width: 120px;">Time</th>
                  <th style="width: 100px;">Level</th>
                  <th style="width: 180px;">Logger</th>
                  <th>Message</th>
                </tr>
              </thead>
              <tbody id="log-body">
                <!-- Logs rendered here -->
              </tbody>
            </table>
          </div>
          <div class="p-2 border-top bg-main d-flex justify-content-center">
             <div id="pagination" class="d-flex gap-1"></div>
          </div>
        </div>

        <!-- DETAILS PANEL -->
        <aside class="details-panel border-start d-flex flex-column" id="detailsPanel">
          <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-header">
            <h6 class="mb-0 fw-bold">Log Details</h6>
            <div>
              <button class="btn btn-icon btn-subtle btn-sm me-1" id="copyDetailsBtn" title="Copy Raw JSON">
                <i class="bi bi-clipboard"></i>
              </button>
              <button class="btn btn-icon btn-subtle btn-sm" id="closeDetailsBtn">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
          </div>
          <div class="flex-grow-1 overflow-auto p-0 custom-scroll" id="detailsContent">
            <!-- Content injected via JS -->
          </div>
        </aside>

      </div>

      <footer class="app-footer">
        <div class="credit">
          Built with <i class="bi bi-heart-fill heart"></i> by <a href="https://github.com/vishwajitvm" target="_blank"><i class="bi bi-github me-1"></i>VishwajitVM</a>
        </div>
        <div class="d-flex align-items-center gap-3">
          <span class="badge rounded-pill bg-secondary bg-opacity-25 text-secondary border border-secondary border-opacity-25" id="appVersionBadge">v0.1.11</span>
          <span>Local · Non-Blocking · Safe</span>
        </div>
      </footer>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
